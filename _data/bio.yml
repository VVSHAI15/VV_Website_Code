eyebrow: The Composer
heading: AviShai's Story
image: Images/BioPic.jpg
image_alt: AviShai Dayanim conducting
body: |-
  AviShai Dayanim is a composer, orchestrator, producer, and storyteller based in Los Angeles, California. A graduate of the Johns Hopkins University and the Peabody Institute, he holds a Bachelor of Music in Music for New Media and a Bachelor of Science in Computer Science — a dual-degree background that shapes his work at the intersection of composition and technology.

  From an early age, AviShai has been captivated by the power of music to tell stories and evoke deep emotions. He has composed scores for short films, theater productions, and video games — earning multiple awards at Film Festivals, most recently for his work on _The Velvet Rose._ His love for storytelling through music also drives his innovative sound design, crafting unique virtual instruments that bring new dimensions to his compositions.

  In May 2023, AviShai embarked on an exciting venture into virtual instrument creation through an internship at Impact Soundworks LLC. He has since had the honor of working alongside renowned composers including Michael Levine (_Megamind, The Simpsons Movie_), Mac Quayle (_Mr. Robot, American Horror Story_), and is a technical score assistant for Henry Jackman (_Captain America, X-Men, Kingsman_).
